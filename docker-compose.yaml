x-common: &common
  image: ${IMAGE:-datachain_processor}
  restart: unless-stopped
  ports:
    - "8889:8888"
#    - "8050:8050"
  command: ["bash", "/usr/local/bin/renku-start.sh"]
#  command: >
#    bash -c "
#    jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='my-token' &
#    python /acsm-fairifier/app/data_flagging_app.py
#    "

services:
  # Default: local data
  datachain_processor:
    <<: *common
    environment:
      - DOCKER_CONTAINER=1
      - NETWORK_MOUNT=/acsm-fairifier/data
    volumes:
      - ./:/workspace/acsm-fairifier

  # Optional: external network drive
  datachain_processor_networked:
    <<: *common
    environment:
      - DOCKER_CONTAINER=1
      - NETWORK_MOUNT=/mnt/network_mount
    volumes:
      - ./:/acsm-fairifier
      - network_mount:/mnt/network_mount:rw
    profiles:
      - networked

volumes:
  network_mount:
    driver_opts:
      type: cifs
      o: "username=${CIFS_USER},password=${CIFS_PASS},vers=3.0"
      device: "${NETWORK_MOUNT}"