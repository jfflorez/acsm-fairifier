[DEFAULT]
# data root directory, your ACMCC_Export directory 
root_dir=~/ACMCC_Export
# day data directory template. You shouldn't have to change it
fdir_tpl=%(root_dir)s/${YYYY}/${MM}/${DD}
enable=0


[BIR_ACSM_140144_RAW_NRT]
# enable transfer of this product if set to 1
enable=0
instrument_sid = BIR_ACSM_140144
platform_sid = BIR
description = Quadrupole ACSM #140144 - Birkenes Observatory - Native format
regex = Birkenes_ACSM-140144_(?P<year>[0-9]{4})((?P<month>[0-9]{2})(?P<day>[0-9]{2})(?P<hour>[0-9]{2})(?P<min>[0-9]{2}))?.txt

[ZEP_ACSM_016_RAW_NRT]
instrument_sid = ZEP_ACSM_016
platform_sid = ZEP
description = ToF ACSM 016 - Zeppelin Mountain (Ny Ålesund) - Native format
regex = Zeppelin_ACSM-016_(?P<year>[0-9]{4})((?P<month>[0-9]{2})(?P<day>[0-9]{2})(?P<hour>[0-9]{2})(?P<min>[0-9]{2}))?.txt


[GIF_ACSM_140113_RAW_NRT]
# enable transfer of this product if set to 1
enable=1
instrument_sid = GIF_ACSM_140113
platform_sid = GIF
description = Quadrupole ACSM #140113 - SIRTA station - Native format
regex = SIRTA_ACSM-140113_(?P<year>[0-9]{4})((?P<month>[0-9]{2})(?P<day>[0-9]{2})(?P<hour>[0-9]{2})(?P<min>[0-9]{2}))?.txt
# --- ACMCC centralized config, comment it if ran directly from acquisition station --- #
# root_dir=/data_push/ground_based/pull/ACMCC/sirta-acsm/

[GIF_ACSM_140142_RAW_NRT]
# your own instrument/product ID. Should be ACSM_<serial-number>_RAW_NRT. Same as section title (the bracketted line above)
instrument_sid = GIF_ACSM_140142
platform_sid = GIF
description = Quadrupole ACSM #140142 - SIRTA station - Native format
