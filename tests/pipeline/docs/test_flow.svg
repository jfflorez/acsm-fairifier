<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 680" role="img"><title>How the pipeline baseline test runs</title><desc>make_fixture.sh cuts a few days from the real input; conftest builds a temporary project where the pipeline steps write a data folder with the raw copy, processed and flag CSVs with lineage JSON, the EBAS .nas and synced params; run-specific names are masked; the result is written to or compared with the baseline.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="680" fill="#FFFFFF"/><rect x="40" y="40" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="130.0" y="58" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Real input folder</text><text x="130.0" y="78" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">one year of files</text><line x1="220" y1="68" x2="246" y2="68" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="250" y="40" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="58" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">make_fixture.sh</text><text x="340.0" y="78" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">cut window, drop Org_*</text><line x1="430" y1="68" x2="456" y2="68" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="460" y="40" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="550.0" y="58" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">fixtures/</text><text x="550.0" y="78" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">raw/ + descriptor</text><line x1="550" y1="96" x2="550" y2="126" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="130" width="600" height="330" rx="12" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="5 4"/><text x="60" y="150" text-anchor="start" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Temporary project made by conftest.py (real repo untouched)</text><rect x="60" y="168" width="125" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="122.5" y="186" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Integration</text><text x="122.5" y="206" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">.h5 + raw copy</text><line x1="185" y1="196" x2="201" y2="196" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="205" y="168" width="125" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="267.5" y="186" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Calibration</text><text x="267.5" y="206" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">processed CSVs</text><line x1="330" y1="196" x2="346" y2="196" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="350" y="168" width="125" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="412.5" y="186" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Flags</text><text x="412.5" y="206" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">3 flag CSVs</text><line x1="475" y1="196" x2="491" y2="196" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="495" y="168" width="125" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="557.5" y="186" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">EBAS export</text><text x="557.5" y="206" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">.txt + .nas</text><line x1="340" y1="224" x2="340" y2="254" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="60" y="258" width="560" height="184" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/><text x="76" y="280" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A">data/</text><text x="94" y="301" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A">collection_&lt;date&gt;.h5</text><text x="380" y="301" text-anchor="start" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">binary, not kept</text><text x="94" y="322" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A">collection_&lt;date&gt;/</text><text x="112" y="343" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A">ACSM_TOFWARE/2024/</text><text x="380" y="343" text-anchor="start" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">raw copy of the input</text><text x="112" y="364" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A">ACSM_TOFWARE_processed/2024/</text><text x="380" y="364" text-anchor="start" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">calibrated CSVs + lineage JSON</text><text x="112" y="385" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A">ACSM_TOFWARE_flags/2024/</text><text x="380" y="385" text-anchor="start" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">flag CSVs + lineage JSON</text><text x="94" y="406" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A">CH0002G.&lt;start&gt;.&lt;created&gt;.lev2.nas</text><text x="380" y="406" text-anchor="start" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">EBAS file (+ .txt)</text><text x="76" y="427" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A">pipelines/params/*.yaml</text><text x="380" y="427" text-anchor="start" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">synced from input params/</text><line x1="340" y1="460" x2="340" y2="490" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="140" y="494" width="400" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="512" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Mask run-specific parts</text><text x="340.0" y="532" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">collection_&lt;date&gt; → collection · stamp → CREATED</text><line x1="200" y1="550" x2="200" y2="586" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="480" y1="550" x2="480" y2="586" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="75" y="590" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="200.0" y="608" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">--update-baseline</text><text x="200.0" y="628" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">writes tests/pipeline/baseline/</text><rect x="355" y="590" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="480.0" y="608" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">pytest tests/pipeline</text><text x="480.0" y="628" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">compare, JSON w/o processing_date</text></svg>
